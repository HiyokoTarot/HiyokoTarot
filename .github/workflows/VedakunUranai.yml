name: Vedakun Uranai

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-uranai:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 必要なライブラリをインストール
        working-directory: astro-test
        run: npm ci

      - name: 今日の占いを計算
        working-directory: astro-test
        run: node test.js

      - name: JSONをリポジトリ直下へコピー
        run: cp astro-test/VedakunUranai.json ./VedakunUranai.json

      - name: JSONをGitHubへ保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VedakunUranai.json
          git diff --cached --quiet || git commit -m "今日の星座占いを更新"
          git push
